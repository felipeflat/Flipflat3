name: Build FlipFlat v0.10 Alpha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FlipFlatSensorLab-source-v0.10-alpha.zip'
      - '.github/workflows/build-flipflat-v0.10.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract v0.10 source
        run: unzip -q FlipFlatSensorLab-source-v0.10-alpha.zip
      - name: Verify version
        run: |
          grep -q 'versionName = "0.10-alpha"' FlipFlatSensorLab/app/build.gradle.kts
          grep -q 'versionCode = 12' FlipFlatSensorLab/app/build.gradle.kts
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        working-directory: FlipFlatSensorLab
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipFlat-v0.10-alpha-debug-apk
          path: FlipFlatSensorLab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
